<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPS Monitor</title>
<script>
// Resolve theme before first paint so there's no flash of the wrong theme.
// 'system' (the default) leaves data-theme unset and lets the
// prefers-color-scheme CSS below decide; 'light'/'dark' pin it explicitly.
(function () {
  try {
    var t = localStorage.getItem('nut-dashboard-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* dark palette (default) */
    --bg: #070b12;
    --bg2: #0c1220;
    --bg3: #111a2e;
    --panel: #0e1525;
    --panel2: #0b111e;
    --border: #243556;
    --border-soft: #1a2740;
    --accent: #38bdf8;
    --accent2: #4ade80;
    --accent3: #fb923c;
    --warn: #fbbf24;
    --danger: #f87171;
    --text: #e2eaf8;
    --text-dim: #7a95bf;
    --text-bright: #f8faff;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
    --radius: 10px;

    /* derived tokens -- computed from the palette above, so they never need
       redefining per-theme; they just track whichever accent/text is active */
    --glow: 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent);
    --surface-tint: color-mix(in srgb, var(--text) 3%, transparent);
    --surface-hover: color-mix(in srgb, var(--text) 6%, transparent);
    --header-bg: color-mix(in srgb, var(--bg) 85%, transparent);
    --wash-accent: color-mix(in srgb, var(--accent) 6%, transparent);
    --wash-accent2: color-mix(in srgb, var(--accent2) 5%, transparent);
  }

  /* System preference (only applies when the visitor hasn't explicitly
     picked a theme -- an explicit choice of "dark" always wins). */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f8fc;
      --bg2: #eaf0f8;
      --bg3: #dde7f2;
      --panel: #ffffff;
      --panel2: #f8fafd;
      --border: #d3ddec;
      --border-soft: #e3eaf5;
      --accent: #0284c7;
      --accent2: #15803d;
      --accent3: #c2410c;
      --warn: #b45309;
      --danger: #dc2626;
      --text: #1e293b;
      --text-dim: #5b6b85;
      --text-bright: #0b1220;
    }
  }

  /* Explicit choice always wins over system preference. */
  :root[data-theme="light"] {
    --bg: #f5f8fc;
    --bg2: #eaf0f8;
    --bg3: #dde7f2;
    --panel: #ffffff;
    --panel2: #f8fafd;
    --border: #d3ddec;
    --border-soft: #e3eaf5;
    --accent: #0284c7;
    --accent2: #15803d;
    --accent3: #c2410c;
    --warn: #b45309;
    --danger: #dc2626;
    --text: #1e293b;
    --text-dim: #5b6b85;
    --text-bright: #0b1220;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 0%, var(--wash-accent) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 10%, var(--wash-accent2) 0%, transparent 50%);
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon svg { width: 34px; height: 34px; display: block; }

  .logo-text {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .logo-sub {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .refresh-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .theme-switch {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .theme-opt {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-left: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
  }

  .theme-opt:first-child { border-left: none; }
  .theme-opt svg { width: 14px; height: 14px; }
  .theme-opt:hover { color: var(--accent); background: var(--surface-hover); }
  .theme-opt.active { color: var(--accent); background: var(--wash-accent); }

  .refresh-btn {
    padding: 7px 16px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }
  .refresh-btn .spin { display: inline-block; transition: transform 0.5s; }
  .refresh-btn.loading .spin { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .last-update {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 6px var(--accent2);
    animation: pulse-green 2s infinite;
  }

  main { padding: 28px 32px 48px; max-width: 1400px; margin: 0 auto; }

  /* ---------- Overview strip ---------- */
  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .overview-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    animation: fadeIn 0.4s ease forwards;
    opacity: 0;
  }

  .overview-card:hover { transform: translateY(-2px); }
  .overview-card.online { border-color: color-mix(in srgb, var(--accent2) 30%, transparent); }
  .overview-card.offline { border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
  .overview-card.warning { border-color: color-mix(in srgb, var(--warn) 30%, transparent); }

  .ring {
    position: relative;
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring-track { stroke: var(--bg3); }
  .ring-progress {
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease, stroke 0.4s ease;
  }

  .ring-value {
    position: relative;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-bright);
  }

  .overview-body { flex: 1; min-width: 0; }

  .overview-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .overview-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .overview-status {
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .overview-status.online { color: var(--accent2); }
  .overview-status.offline { color: var(--danger); }
  .overview-status.warning { color: var(--warn); }

  .section-label {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 8px 0 12px;
  }

  /* ---------- Detailed grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
    gap: 24px;
  }

  .ups-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.3s;
    animation: fadeIn 0.4s ease forwards;
    opacity: 0;
    scroll-margin-top: 90px;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-green { 0%,100% { opacity:1; box-shadow:0 0 0 0 color-mix(in srgb, var(--accent2) 40%, transparent);} 50% { opacity:0.85; box-shadow:0 0 0 4px transparent;} }
  @keyframes pulse-warn { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  @keyframes shimmer { from { transform: translateX(-100%);} to { transform: translateX(100%);} }

  .ups-card.online { border-color: color-mix(in srgb, var(--accent2) 25%, transparent); }
  .ups-card.offline { border-color: color-mix(in srgb, var(--danger) 25%, transparent); }
  .ups-card.warning { border-color: color-mix(in srgb, var(--warn) 25%, transparent); }

  .card-header {
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface-tint);
    gap: 12px;
    flex-wrap: wrap;
  }

  .card-title-group { display: flex; flex-direction: column; gap: 3px; }
  .card-title { font-size: 19px; font-weight: 800; color: var(--text-bright); letter-spacing: 0.3px; }
  .card-subtitle { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text-dim); letter-spacing: 0.3px; }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    border: 1px solid;
    white-space: nowrap;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }

  .status-badge.online { background: color-mix(in srgb, var(--accent2) 10%, transparent); border-color: color-mix(in srgb, var(--accent2) 35%, transparent); color: var(--accent2); }
  .status-badge.offline { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); }
  .status-badge.warning { background: color-mix(in srgb, var(--warn) 10%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status-badge.online .status-dot { animation: pulse-green 2s infinite; }
  .status-badge.warning .status-dot { animation: pulse-warn 1.5s infinite; }

  .metrics-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
  }

  .metric { padding: 18px 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; transition: background 0.2s; }
  .metric:last-child { border-right: none; }
  .metric:hover { background: var(--surface-hover); }
  .metric-label { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
  .metric-value { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text-bright); line-height: 1; transition: color 0.3s; }
  .metric-value.accent { color: var(--accent); }
  .metric-value.green { color: var(--accent2); }
  .metric-value.warn { color: var(--warn); }
  .metric-value.danger { color: var(--danger); }
  .metric-value.dim { color: var(--text-dim); font-size: 16px; }

  .battery-section { padding: 18px 24px; border-bottom: 1px solid var(--border); }
  .battery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .battery-label { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
  .battery-pct { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--text-bright); }
  .battery-track { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .battery-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1), background 0.4s; position: relative; }
  .battery-fill::after { content:''; position:absolute; inset:0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.16) 50%, transparent 100%); animation: shimmer 2s infinite; }
  .battery-fill.high { background: linear-gradient(90deg, #16a34a, #4ade80); }
  .battery-fill.medium { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .battery-fill.low { background: linear-gradient(90deg, #dc2626, #f87171); }

  .details-toggle {
    padding: 13px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    border: none;
    background: transparent;
    width: 100%;
    font-family: var(--sans);
    transition: all 0.2s;
  }

  .details-toggle:hover { color: var(--accent); background: var(--wash-accent); }
  .toggle-arrow { font-size: 13px; transition: transform 0.3s; }
  .details-toggle[aria-expanded="true"] .toggle-arrow { transform: rotate(180deg); }

  .details-panel { display: none; padding: 0 24px 20px; border-top: 1px solid var(--border); }
  .details-panel.open { display: block; }

  .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; margin-top: 14px; }
  .detail-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 4px; transition: background 0.15s; min-width: 0; }
  .detail-row:hover { background: var(--surface-hover); }
  .detail-key { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1; min-width: 0; }
  .detail-val { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--text); text-align: right; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 2; }

  .error-state { padding: 36px 24px; text-align: center; }
  .error-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }
  .error-msg { font-family: var(--mono); font-size: 13px; color: var(--danger); letter-spacing: 1px; }
  .error-sub { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 6px; }

  .footnote {
    margin-top: 28px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.5px;
  }

  @media (max-width: 700px) {
    main { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    .metrics-row { grid-template-columns: repeat(2, 1fr); }
    .details-grid { grid-template-columns: 1fr; }
    header { padding: 12px 16px; }
    .overview { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="10" width="28" height="16" rx="2" stroke="#38bdf8" stroke-width="1.5"/>
        <rect x="7" y="13" width="5" height="10" rx="1" fill="#38bdf8" opacity="0.8"/>
        <rect x="14" y="13" width="5" height="10" rx="1" fill="#38bdf8" opacity="0.5"/>
        <rect x="21" y="13" width="5" height="10" rx="1" fill="#38bdf8" opacity="0.3"/>
        <path d="M18 6 L18 10 M18 26 L18 30" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="18" cy="18" r="2" fill="#4ade80"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">UPS Monitor</div>
      <div class="logo-sub">Network UPS Tools Dashboard</div>
    </div>
  </div>
  <div class="header-right">
    <span class="last-update"><span class="live-dot"></span><span id="lastUpdate">—</span></span>
    <div class="theme-switch" role="group" aria-label="Color theme">
      <button class="theme-opt" data-mode="light" onclick="setThemeMode('light')" aria-label="Light theme"></button>
      <button class="theme-opt" data-mode="system" onclick="setThemeMode('system')" aria-label="Match system theme"></button>
      <button class="theme-opt" data-mode="dark" onclick="setThemeMode('dark')" aria-label="Dark theme"></button>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData(true)"><span class="spin">⟳</span> REFRESH</button>
  </div>
</header>

<main>
  <div class="section-label">Overview</div>
  <div class="overview" id="overview"></div>

  <div class="section-label">Detail</div>
  <div class="grid" id="grid"></div>

  <div class="footnote" id="footnote"></div>
</main>

<script>
const REFRESH_MS = 15000;

/* ---------------- Theme ---------------- */

const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
const SYSTEM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>';
const THEME_ICONS = { light: SUN_ICON, system: SYSTEM_ICON, dark: MOON_ICON };

function currentThemeMode() {
  const stored = (() => { try { return localStorage.getItem('nut-dashboard-theme'); } catch (e) { return null; } })();
  return stored === 'light' || stored === 'dark' ? stored : 'system';
}

function renderThemeSwitch() {
  const mode = currentThemeMode();
  document.querySelectorAll('.theme-opt').forEach((btn) => {
    if (btn.innerHTML === '') btn.innerHTML = THEME_ICONS[btn.dataset.mode];
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
}

function setThemeMode(mode) {
  if (mode === 'system') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', mode);
  }
  try { localStorage.setItem('nut-dashboard-theme', mode); } catch (e) {}
  renderThemeSwitch();
}

renderThemeSwitch();

/* ---------------- Formatting helpers ---------------- */

const STATUS_MAP = {
  'OL': { label: 'Online', cls: 'online' },
  'OB': { label: 'On Battery', cls: 'warning' },
  'LB': { label: 'Low Battery', cls: 'offline' },
  'HB': { label: 'High Battery', cls: 'online' },
  'RB': { label: 'Replace Battery', cls: 'offline' },
  'CHRG': { label: 'Charging', cls: 'online' },
  'DISCHRG': { label: 'Discharging', cls: 'warning' },
  'BYPASS': { label: 'Bypass', cls: 'warning' },
  'OFF': { label: 'Offline', cls: 'offline' },
  'TRIM': { label: 'Trimming', cls: 'warning' },
  'BOOST': { label: 'Boosting', cls: 'warning' },
  'WAIT': { label: 'Starting', cls: 'warning' },
  'CAL': { label: 'Calibrating', cls: 'warning' },
};

function parseStatus(raw) {
  if (!raw) return { label: 'Unknown', cls: 'offline' };
  const tokens = raw.trim().split(/\s+/);
  for (const priority of ['RB', 'LB', 'OB', 'BYPASS', 'OFF']) {
    if (tokens.includes(priority)) return STATUS_MAP[priority] || { label: priority, cls: 'warning' };
  }
  return STATUS_MAP[tokens[0]] || { label: tokens[0], cls: 'warning' };
}

function formatRuntime(seconds) {
  if (seconds === undefined || seconds === null || seconds === '') return '—';
  const s = parseInt(seconds, 10);
  if (isNaN(s)) return '—';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}

function batteryClass(pct) {
  const p = parseFloat(pct);
  if (isNaN(p)) return 'high';
  if (p <= 20) return 'low';
  if (p <= 50) return 'medium';
  return 'high';
}

function ringColor(pct, cls) {
  if (cls === 'offline') return 'var(--danger)';
  if (cls === 'warning') return 'var(--warn)';
  const p = parseFloat(pct);
  if (!isNaN(p) && p <= 20) return 'var(--danger)';
  if (!isNaN(p) && p <= 50) return 'var(--warn)';
  return 'var(--accent2)';
}

// SVG stroke-circle ring -- crisper than a conic-gradient/mask trick, which
// rasterizes and looks soft/aliased at this size in most browsers.
const RING_R = 25;
const RING_C = 2 * Math.PI * RING_R;

function ringOffset(pct) {
  const p = Math.max(0, Math.min(100, isNaN(pct) ? 0 : pct));
  return (RING_C * (1 - p / 100)).toFixed(2);
}

function ringSvg(pct, color) {
  return `
    <svg viewBox="0 0 56 56">
      <circle class="ring-track" cx="28" cy="28" r="${RING_R}" fill="none" stroke-width="6"/>
      <circle class="ring-progress" cx="28" cy="28" r="${RING_R}" fill="none" stroke-width="6"
        style="stroke:${color}" stroke-dasharray="${RING_C.toFixed(2)}"
        stroke-dashoffset="${ringOffset(pct)}" transform="rotate(-90 28 28)"/>
    </svg>`;
}

const METRIC_DEFS = [
  { key: 'battery.charge', label: 'Battery', fmt: (v) => v + '%', color: (v) => { const p = parseFloat(v); if (p <= 20) return 'danger'; if (p <= 50) return 'warn'; return 'green'; } },
  { key: '__runtime', label: 'Runtime', fmt: (v, vars) => formatRuntime(vars['battery.runtime']), color: () => 'accent', always: true },
  { key: 'ups.load', label: 'Load', fmt: (v) => v + '%', color: (v) => { const p = parseFloat(v); if (p >= 90) return 'danger'; if (p >= 70) return 'warn'; return 'accent'; } },
  { key: 'input.voltage', label: 'Input', fmt: (v) => parseFloat(v).toFixed(1) + ' V', color: () => '' },
  { key: 'output.voltage', label: 'Output', fmt: (v) => parseFloat(v).toFixed(1) + ' V', color: () => '' },
  { key: 'ups.realpower.nominal', label: 'Capacity', fmt: (v) => v + ' W', color: () => '' },
  { key: 'battery.voltage', label: 'Batt. Voltage', fmt: (v) => parseFloat(v).toFixed(1) + ' V', color: () => '' },
  { key: 'battery.type', label: 'Battery Type', fmt: (v) => v, color: () => 'dim' },
];

function pickMetrics(vars) {
  const picked = [];
  for (const def of METRIC_DEFS) {
    if (picked.length >= 4) break;
    const raw = def.always ? '1' : vars[def.key];
    if (raw === undefined || raw === null || raw === '') continue;
    picked.push({ label: def.label, value: def.fmt(raw, vars), color: def.color(raw) });
  }
  while (picked.length < 4) picked.push({ label: '—', value: '—', color: 'dim' });
  return picked;
}

function groupSort(vars) {
  return Object.entries(vars).sort(([a], [b]) => a.localeCompare(b));
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/* ---------------- Overview card: build + in-place update ---------------- */

function overviewCardHtml(ups) {
  if (ups.status === 'error') {
    return `
    <div class="overview-card offline" id="ovcard-${ups.id}" data-shape="error" onclick="scrollToCard('${ups.id}')">
      <div class="ring">${ringSvg(0, 'var(--danger)')}<span class="ring-value">--</span></div>
      <div class="overview-body">
        <div class="overview-title">${ups.label}</div>
        <div class="overview-meta"><span class="overview-status offline">Unreachable</span></div>
      </div>
    </div>`;
  }
  const v = ups.vars || {};
  const status = parseStatus(v['ups.status']);
  const batt = v['battery.charge'] !== undefined ? parseFloat(v['battery.charge']) : NaN;
  const runtime = formatRuntime(v['battery.runtime']);
  return `
  <div class="overview-card ${status.cls}" id="ovcard-${ups.id}" data-shape="ok" onclick="scrollToCard('${ups.id}')">
    <div class="ring">${ringSvg(batt, ringColor(batt, status.cls))}
      <span class="ring-value">${isNaN(batt) ? '—' : batt + '%'}</span>
    </div>
    <div class="overview-body">
      <div class="overview-title">${ups.label}</div>
      <div class="overview-meta">
        <span class="overview-status ${status.cls}">${status.label}</span>
        <span>·</span>
        <span class="ov-runtime">${runtime} left</span>
      </div>
    </div>
  </div>`;
}

function updateOverviewCardEl(node, ups) {
  const shape = ups.status === 'error' ? 'error' : 'ok';
  if (node.dataset.shape !== shape) return false;
  if (shape === 'error') return true; // nothing dynamic to patch in the error shape

  const v = ups.vars || {};
  const status = parseStatus(v['ups.status']);
  const batt = v['battery.charge'] !== undefined ? parseFloat(v['battery.charge']) : NaN;
  const runtime = formatRuntime(v['battery.runtime']);

  node.className = 'overview-card ' + status.cls;
  const ring = node.querySelector('.ring');
  const progress = ring.querySelector('.ring-progress');
  progress.setAttribute('stroke-dashoffset', ringOffset(batt));
  progress.style.stroke = ringColor(batt, status.cls);
  ring.querySelector('.ring-value').textContent = isNaN(batt) ? '—' : batt + '%';

  node.querySelector('.overview-title').textContent = ups.label;
  const statusEl = node.querySelector('.overview-status');
  statusEl.textContent = status.label;
  statusEl.className = 'overview-status ' + status.cls;
  node.querySelector('.ov-runtime').textContent = runtime + ' left';
  return true;
}

/* ---------------- Detail card: build + in-place update ---------------- */

function cardHtml(ups) {
  if (ups.status === 'error') {
    return `
    <div class="ups-card offline" id="card-${ups.id}" data-shape="error">
      <div class="card-header">
        <div class="card-title-group">
          <div class="card-title">${ups.label}</div>
          <div class="card-subtitle">${ups.host}:${ups.port} · ${ups.ups}</div>
        </div>
        <div class="status-badge offline"><div class="status-dot"></div>Unreachable</div>
      </div>
      <div class="error-state">
        <div class="error-icon">⚡</div>
        <div class="error-msg">CONNECTION FAILED</div>
        <div class="error-sub">${ups.error || 'Unable to reach NUT server'}</div>
      </div>
    </div>`;
  }

  const v = ups.vars || {};
  const status = parseStatus(v['ups.status']);
  const batt = v['battery.charge'] !== undefined ? parseFloat(v['battery.charge']) : NaN;
  const battCls = batteryClass(batt);
  const model = v['ups.model'] || v['device.model'] || ups.ups;
  const metrics = pickMetrics(v);
  const allVars = groupSort(v);

  const detailRows = allVars.map(([k, val]) =>
    `<div class="detail-row" data-key="${k}"><span class="detail-key">${k}</span><span class="detail-val" title="${val}">${val}</span></div>`
  ).join('');

  const metricsHtml = metrics.map((m) =>
    `<div class="metric"><div class="metric-label">${m.label}</div><div class="metric-value ${m.color}">${m.value}</div></div>`
  ).join('');

  return `
  <div class="ups-card ${status.cls}" id="card-${ups.id}" data-shape="ok">
    <div class="card-header">
      <div class="card-title-group">
        <div class="card-title">${ups.label}</div>
        <div class="card-subtitle">${ups.host}:${ups.port} · ${ups.ups} · ${model}</div>
      </div>
      <div class="status-badge ${status.cls}"><div class="status-dot"></div>${status.label}</div>
    </div>

    <div class="metrics-row">${metricsHtml}</div>

    <div class="battery-section">
      <div class="battery-header">
        <span class="battery-label">Battery Charge</span>
        <span class="battery-pct">${isNaN(batt) ? '—' : batt + '%'}</span>
      </div>
      <div class="battery-track"><div class="battery-fill ${battCls}" style="width:${isNaN(batt) ? 0 : batt}%"></div></div>
    </div>

    <button class="details-toggle" id="toggle-${ups.id}" aria-expanded="false" onclick="toggleDetails('${ups.id}')">
      <span>All Variables (${allVars.length})</span>
      <span class="toggle-arrow">▾</span>
    </button>
    <div class="details-panel" id="details-${ups.id}">
      <div class="details-grid">${detailRows}</div>
    </div>
  </div>`;
}

function updateCardEl(node, ups) {
  const shape = ups.status === 'error' ? 'error' : 'ok';
  if (node.dataset.shape !== shape) return false;
  if (shape === 'error') {
    node.querySelector('.error-sub').textContent = ups.error || 'Unable to reach NUT server';
    return true;
  }

  const v = ups.vars || {};
  const status = parseStatus(v['ups.status']);
  const batt = v['battery.charge'] !== undefined ? parseFloat(v['battery.charge']) : NaN;
  const battCls = batteryClass(batt);
  const model = v['ups.model'] || v['device.model'] || ups.ups;
  const metrics = pickMetrics(v);
  const allVars = groupSort(v);

  node.className = 'ups-card ' + status.cls;
  node.querySelector('.card-subtitle').textContent = `${ups.host}:${ups.port} · ${ups.ups} · ${model}`;
  const badge = node.querySelector('.status-badge');
  badge.className = 'status-badge ' + status.cls;
  badge.innerHTML = `<div class="status-dot"></div>${status.label}`;

  const metricEls = node.querySelectorAll('.metric');
  metrics.forEach((m, i) => {
    const mEl = metricEls[i];
    if (!mEl) return;
    mEl.querySelector('.metric-label').textContent = m.label;
    const valEl = mEl.querySelector('.metric-value');
    valEl.textContent = m.value;
    valEl.className = 'metric-value ' + m.color;
  });

  node.querySelector('.battery-pct').textContent = isNaN(batt) ? '—' : batt + '%';
  const fill = node.querySelector('.battery-fill');
  fill.style.width = (isNaN(batt) ? 0 : batt) + '%';
  fill.className = 'battery-fill ' + battCls;

  // Detail rows: patch values in place when the variable set is unchanged
  // (the common case); only rebuild the grid if the set of keys differs.
  const grid = node.querySelector('.details-grid');
  const existingKeys = Array.from(grid.children).map((c) => c.dataset.key);
  const newKeys = allVars.map(([k]) => k);
  const sameKeys = existingKeys.length === newKeys.length && existingKeys.every((k, i) => k === newKeys[i]);

  if (sameKeys) {
    allVars.forEach(([k, val], i) => {
      const row = grid.children[i];
      const valEl = row.querySelector('.detail-val');
      if (valEl.textContent !== String(val)) {
        valEl.textContent = val;
        valEl.title = val;
      }
    });
  } else {
    grid.innerHTML = allVars.map(([k, val]) =>
      `<div class="detail-row" data-key="${k}"><span class="detail-key">${k}</span><span class="detail-val" title="${val}">${val}</span></div>`
    ).join('');
  }

  node.querySelector('.details-toggle span').textContent = `All Variables (${allVars.length})`;
  return true;
}

/* ---------------- Reconcile + fetch loop ---------------- */

function reconcile(container, data, buildHtml, updateFn, idPrefix) {
  const seen = new Set();
  data.forEach((ups) => {
    const domId = idPrefix + ups.id;
    seen.add(domId);
    const existing = document.getElementById(domId);
    if (!existing) {
      container.appendChild(el(buildHtml(ups)));
      return;
    }
    const ok = updateFn(existing, ups);
    if (!ok) {
      const replacement = el(buildHtml(ups));
      existing.replaceWith(replacement);
    }
  });
  // Drop cards for UPS entries no longer present in the config.
  Array.from(container.children).forEach((child) => {
    if (!seen.has(child.id)) child.remove();
  });
}

function toggleDetails(id) {
  const panel = document.getElementById('details-' + id);
  const toggle = document.getElementById('toggle-' + id);
  const open = panel.classList.toggle('open');
  toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function scrollToCard(id) {
  const el = document.getElementById('card-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function loadData(manual) {
  const btn = document.getElementById('refreshBtn');
  if (manual) btn.classList.add('loading');
  try {
    const res = await fetch('/api/ups', { cache: 'no-store' });
    const data = await res.json();

    reconcile(document.getElementById('overview'), data, overviewCardHtml, updateOverviewCardEl, 'ovcard-');
    reconcile(document.getElementById('grid'), data, cardHtml, updateCardEl, 'card-');

    const ok = data.filter((d) => d.status === 'ok').length;
    document.getElementById('footnote').textContent =
      ok + ' of ' + data.length + ' UPS reachable · polling every ' + Math.round(REFRESH_MS / 1000) + 's';
    document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('lastUpdate').textContent = 'Update failed';
    console.error(e);
  } finally {
    if (manual) setTimeout(() => btn.classList.remove('loading'), 400);
  }
}

loadData();
setInterval(loadData, REFRESH_MS);
</script>

</body>
</html>
